name: One-time read-only repository audit
on:
  push:
    branches: [audit/credential-history-20261126]
    paths: ['.github/workflows/one-time-credential-audit.yml']
permissions: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Scan public Git history without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          export GIT_TERMINAL_PROMPT=0
          url=https://github.com/gitleaks/gitleaks/releases/download/v8.24.3
          curl --fail --silent --show-error --location --retry 2 "$url/gitleaks_8.24.3_linux_x64.tar.gz" -o scanner.tar.gz
          curl --fail --silent --show-error --location --retry 2 "$url/gitleaks_8.24.3_checksums.txt" -o sums
          awk '$2=="gitleaks_8.24.3_linux_x64.tar.gz" {print $1 "  scanner.tar.gz"}' sums > scanner.sha256
          test -s scanner.sha256
          sha256sum --check scanner.sha256
          tar -xzf scanner.tar.gz gitleaks
          ./gitleaks version
          cat > cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEFTCCAn2gAwIBAgIUcPkJngWcdv6n4CJQ8fw4w/3AdeIwDQYJKoZIhvcNAQEL
