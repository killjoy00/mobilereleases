name: Mobile release dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'
  pull_request:
    paths:
      - 'README.md'
      - 'mobile-releases/**'
      - '.github/workflows/mobile-release-status.yml'
  push:
    branches: [main]
    paths:
      - 'mobile-releases/**'
      - '.github/workflows/mobile-release-status.yml'

permissions:
  contents: read

concurrency:
  group: mobile-release-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test dashboard and evidence boundaries
        run: python3 -m unittest discover -s mobile-releases -p 'test_*.py'
      - name: Preview dashboard offline
        run: python3 mobile-releases/status.py --homepage >> "$GITHUB_STEP_SUMMARY"

  refresh:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh homepage with public evidence
        run: python3 mobile-releases/status.py --live --update-readme >> "$GITHUB_STEP_SUMMARY"
      - name: Publish dashboard to this repository only
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "Refresh mobile release dashboard"
          git push origin HEAD:main
